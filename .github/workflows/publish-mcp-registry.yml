name: Publish MCP registry record

# Glama, PulseMCP, and mcp.so all ingest from the official registry and cache
# what they read, so a record left behind by a release is slow to correct
# everywhere downstream. Publishing on the tag keeps it in step with npm.
on:
  push:
    tags: ['@churnkey/mcp@*']
  workflow_dispatch:

permissions:
  contents: read

env:
  MCP_PUBLISHER_VERSION: 1.8.1

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher

      # A tag naming one version while server.json names another would publish a
      # record that disagrees with the package it points at. Only meaningful on a
      # tag push; a manual run has no version in the ref to compare.
      - name: Check the tag matches server.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tagged="${GITHUB_REF_NAME##*@}"
          declared=$(node -p "require('./server.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME says $tagged, server.json says $declared." >&2
            exit 1
          fi

      # The com.churnkey namespace is DNS-verified, so this authenticates with the
      # Ed25519 private key published at churnkey.co/.well-known/mcp-registry-auth.
      # Actions OIDC is not an option here — it only covers io.github.* namespaces.
      # MCP_PRIVATE_KEY is the 64-character hex seed.
      - name: Publish
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          ./mcp-publisher login dns --domain churnkey.co --private-key "$MCP_PRIVATE_KEY"
          ./mcp-publisher publish
